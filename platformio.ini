[platformio]
src_dir = esp32_firmware
include_dir = esp32_firmware

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; upload_port = COM7
; monitor_port = COM7
; voice clips are large, so use the 3 MB "huge app" partition layout
board_build.partitions = huge_app.csv
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    bblanchon/ArduinoJson @ ^7.0.4
